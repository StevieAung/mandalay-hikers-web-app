<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandalay Hikers</title>
    <meta
      name="description"
      content="Trail reports, gear advice, and hiking events from the Mandalay trekking community."
    />
    <!-- Baseline card for shared links. This is a client-rendered SPA, so link
         scrapers never see per-post titles or images; that needs SSR. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mandalay Hikers" />
    <meta property="og:title" content="Mandalay Hikers" />
    <meta
      property="og:description"
      content="Trail reports, gear advice, and hiking events from the Mandalay trekking community."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
